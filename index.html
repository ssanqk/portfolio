<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ssanqk | AI-агенти, чат-боти та веброзробка</title>
  <meta name="description" content="Розробляю AI-агентів, Telegram-ботів, лендинги та вебзастосунки під замовлення. Python, Claude API, Next.js, PostgreSQL.">
  <meta name="theme-color" content="#060606">
  <meta name="color-scheme" content="dark">
  <meta name="author" content="ssanqk">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:title" content="ssanqk | AI-агенти, чат-боти та веброзробка">
  <meta property="og:description" content="AI-агенти, чат-боти, лендинги та вебзастосунки під замовлення.">
  <meta property="og:url" content="https://ssanqk.github.io/portfolio/">
  <meta property="og:image" content="https://ssanqk.github.io/portfolio/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="canonical" href="https://ssanqk.github.io/portfolio/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">

  <script>document.documentElement.classList.add("js");</script>
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти до змісту</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a class="nav__logo" href="#top" aria-label="На початок сторінки">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="9" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
        <path d="M7 19c3 0 3-6 6-6s3 6 6 6 3-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span data-bind="brand">ssanqk</span>
    </a>
    <nav class="nav__links" aria-label="Основна навігація">
      <a href="#services">Послуги</a>
      <a href="#projects">Проєкти</a>
      <a href="#contact">Контакт</a>
    </nav>
    <a class="btn btn--primary btn--sm" data-bind-href="contactUrl" href="#contact">Написати</a>
  </header>

  <main id="main">
    <!-- 1. Hero -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="container hero__inner">
        <span class="badge reveal"><span class="badge__dot badge__dot--live" aria-hidden="true"></span><span data-bind="hero.badge"></span></span>
        <h1 class="hero__title reveal" id="hero-title" style="--delay:.08s" data-bind="hero.title"></h1>
        <p class="hero__lead reveal" style="--delay:.16s" data-bind="hero.lead"></p>
        <div class="hero__actions reveal" style="--delay:.24s">
          <a class="btn btn--primary" data-bind-href="contactUrl" href="#contact">Обговорити проєкт</a>
          <a class="btn btn--ghost" href="#projects">Переглянути роботи</a>
        </div>
      </div>
      <div class="hero__visual" aria-hidden="true">
        <canvas id="wave"></canvas>
      </div>
    </section>

    <!-- 2. Технології -->
    <section class="stack" aria-label="Технології">
      <div class="container">
        <p class="stack__caption reveal">Працюю з інструментами, які легко підтримувати</p>
        <ul class="stack__list reveal" style="--delay:.1s" id="stack-list"></ul>
      </div>
    </section>

    <!-- 3. Що я роблю -->
    <section class="section" id="services" aria-labelledby="services-title">
      <div class="container">
        <div class="section__head">
          <span class="badge reveal"><span class="badge__dot" aria-hidden="true"></span>Послуги</span>
          <h2 class="section__title reveal" id="services-title" style="--delay:.06s">Що я роблю</h2>
          <p class="section__lead reveal" style="--delay:.12s" data-bind="servicesLead"></p>
        </div>
        <div class="services" id="services-list"></div>
      </div>
    </section>

    <!-- 4. Проєкти -->
    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="container">
        <div class="section__head">
          <span class="badge reveal"><span class="badge__dot" aria-hidden="true"></span>Проєкти</span>
          <h2 class="section__title reveal" id="projects-title" style="--delay:.06s">Вибрані роботи</h2>
          <p class="section__lead reveal" style="--delay:.12s" data-bind="projectsLead"></p>
        </div>
        <div class="projects" id="projects-list"></div>
      </div>
    </section>
  </main>

  <!-- 5. Футер -->
  <footer class="footer" id="contact" aria-labelledby="contact-title">
    <div class="container">
      <div class="contact">
        <span class="badge reveal"><span class="badge__dot badge__dot--live" aria-hidden="true"></span>Контакт</span>
        <h2 class="contact__title reveal" id="contact-title" style="--delay:.06s" data-bind="contactTitle"></h2>
        <div class="contact__actions reveal" style="--delay:.12s" id="contact-actions"></div>
      </div>
      <div class="footer__bar">
        <p>© <span id="year"></span> <span data-bind="brand"></span></p>
        <ul class="footer__socials" id="footer-socials"></ul>
      </div>
    </div>
  </footer>

  <noscript>
    <style>.hero__title,.hero__lead{display:none}</style>
    <p style="text-align:center;padding:2rem;color:#a3a3a3">Увімкніть JavaScript, щоб побачити вміст сторінки.</p>
  </noscript>
</body>
</html>
